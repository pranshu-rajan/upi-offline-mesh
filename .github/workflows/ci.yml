name: Full-Stack CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Spring Boot Backend Test Suite
  backend-test:
    name: Backend Tests (Java 17 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Backend Unit & Concurrency Tests
        run: ./mvnw clean test

  # 2. Next.js 14+ Frontend Verification
  frontend-build:
    name: Frontend Build (Next.js / TypeScript / Tailwind)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Dashboard
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # 3. FastAPI Edge Gateway Syntax & Dependency Check
  gateway-check:
    name: Edge Gateway (Python / FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax & bytecode compilation
        run: python -m py_compile main.py
