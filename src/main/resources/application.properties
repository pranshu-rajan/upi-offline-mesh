# Server
server.port=${SERVER_PORT:8080}

# ==============================================================================
# Database Configuration (Supabase PostgreSQL with automatic H2 fallback)
# ==============================================================================
# In production (e.g. on Render connected to Supabase):
#   SPRING_DATASOURCE_URL=jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME=postgres
#   SPRING_DATASOURCE_PASSWORD=your_supabase_db_password
#
# When running locally or during CI tests without environment variables,
# it automatically defaults to H2 in-memory database with zero setup.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:upimesh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# HikariCP automatically detects org.postgresql.Driver or org.h2.Driver from the JDBC URL prefix
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}

# JPA / Hibernate configuration
# 'update' automatically updates schemas in Supabase while preserving tables and records
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console (accessible at /h2-console when running in H2 mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Idempotency window (how long a packet hash is remembered)
upi.mesh.idempotency-ttl-seconds=${UPI_MESH_IDEMPOTENCY_TTL_SECONDS:86400}

# Packet freshness window — anything older than this is rejected as replay
upi.mesh.packet-max-age-seconds=${UPI_MESH_PACKET_MAX_AGE_SECONDS:86400}
