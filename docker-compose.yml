version: "3.8"

services:
  # 1. Spring Boot Core Settlement Engine (Java 17)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: upi-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - UPI_MESH_IDEMPOTENCY_TTL_SECONDS=86400
      - UPI_MESH_PACKET_MAX_AGE_SECONDS=86400
    networks:
      - upi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/server-key || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # 2. Next.js 14 Modern Interactive Dashboard (TypeScript + Tailwind CSS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upi-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      backend:
        condition: service_started
    networks:
      - upi-network
    restart: unless-stopped

  # 3. FastAPI Edge Bridge Gateway (Python 3.11)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: upi-edge-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_started
    networks:
      - upi-network
    restart: unless-stopped

networks:
  upi-network:
    driver: bridge
